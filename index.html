<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const supported = ['ko', 'ja', 'en'];
        const normalize = (value) => {
          const language = value?.split('-')[0];
          return supported.includes(language) ? language : null;
        };
        const getStoredLanguage = () => {
          try {
            return window.localStorage.getItem('i18nextLng');
          } catch {
            return null;
          }
        };
        const params = new URLSearchParams(window.location.search);
        const language =
          normalize(params.get('lng')) ||
          normalize(getStoredLanguage()) ||
          normalize(window.navigator.language) ||
          'en';
        document.documentElement.lang = language;

        const fontHref =
          language === 'ko'
            ? '/fonts/gowun-dodum-364eadde.woff2'
            : language === 'ja'
              ? '/fonts/klee-one-baee344b.woff2'
              : null;

        if (fontHref) {
          const preload = document.createElement('link');
          preload.rel = 'preload';
          preload.href = fontHref;
          preload.as = 'font';
          preload.type = 'font/woff2';
          preload.crossOrigin = 'anonymous';
          document.head.appendChild(preload);
        }
      })();
    </script>
    <title>Ahn Jaehyun</title>
    <meta name="description" content="Portfolio of Ahn Jaehyun, a developer who finds answers by tackling problems head-on." />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ahn Jaehyun" />
    <meta property="og:title" content="Ahn Jaehyun" />
    <meta property="og:description" content="Portfolio of Ahn Jaehyun, a developer who finds answers by tackling problems head-on." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body class="bg-white text-slate-900 antialiased transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
